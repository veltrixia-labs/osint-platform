version: '3.8'

services:
  db:
    image: postgres:16
    container_name: osint_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: osint_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: osint_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: osint_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@db/osint_platform
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod-secret-placeholder
      - ENV=production
      - PYTHONPATH=.
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  scheduler:
    build: .
    container_name: osint_scheduler
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@db/osint_platform
      - REDIS_URL=redis://redis:6379/0
      - TZ=UTC
      - PYTHONPATH=.
    depends_on:
      - db
      - redis
    command: python -m jobs.main_scheduler

  web:
    image: nginx:alpine
    container_name: osint_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web_dashboard/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
