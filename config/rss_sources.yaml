  # I. Multilingual pilot (C-4) — GDELT DOC 2.0 API, Japanese coverage.
  # source_type: gdelt -> fetched by fetch_gdelt (gated by ENABLE_GDELT_INGEST).
  # rss_url holds a complete GDELT query URL (sourcelang:japanese, 6-topic core
  # terms). global_news is a GENERIC source_group -> never feed-confers a domain;
  # items are content/LLM classified after JA->EN translation.
  - source_id: gdelt_ja_geo
    source_name: GDELT Japanese (geopolitics/markets)
    source_group: global_news
    source_type: gdelt
    rss_url: "https://api.gdeltproject.org/api/v2/doc/doc?query=sourcelang%3Ajapanese%20%28theme%3AMILITARY%20OR%20theme%3AARMEDCONFLICT%20OR%20theme%3AENV_OIL%20OR%20theme%3AENV_NATURALGAS%20OR%20theme%3AWB_507_ENERGY_AND_EXTRACTIVES%20OR%20theme%3AECON_STOCKMARKET%20OR%20theme%3AECON_WORLDCURRENCIES%20OR%20theme%3AMARITIME%20OR%20theme%3AWB_167_PORTS%20OR%20theme%3AECON_BITCOIN%29&mode=artlist&format=json&maxrecords=75&timespan=4h&sort=datedesc"
    default_topic_candidates: ["global_general", "defense_technology", "energy_resource_risk", "supply_chain_intelligence"]
    reliability_weight: 0.60
    language: ja
    enabled: true
