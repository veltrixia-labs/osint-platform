[pytest]
# Phase 7.2 — async test config.
#
# • asyncio_mode = auto       → every `async def test_*` runs on the loop
#                                without per-test @pytest.mark.asyncio.
# • asyncio_default_fixture_loop_scope = session
#                              → one event loop for the entire suite.
#                                Prevents the "RuntimeError: Event loop is
#                                closed" raised by asyncpg/SQLAlchemy when
#                                a per-test loop tears down with sockets
#                                still owned by the engine.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# -rs prints the REASON for every skip. DB-dependent tests skip when
# TEST_DATABASE_URL is unset (tests/conftest.py), and that must be visible in
# the output, not folded into a bare "4 skipped".
addopts = -rs

testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::DeprecationWarning
